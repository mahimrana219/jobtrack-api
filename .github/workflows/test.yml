name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check MongoDB is reachable
        run: |
          nc -zv 127.0.0.1 27017
          node -e "require('mongoose').connect('mongodb://127.0.0.1:27017/ping',{serverSelectionTimeoutMS:10000}).then(()=>{console.log('MongoDB OK');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
      - run: npm test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/jobtrack_test
